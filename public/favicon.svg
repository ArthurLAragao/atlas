<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Atlas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="40" y1="30" x2="216" y2="226">
      <stop offset="0" stop-color="#F1F4F8"/>
      <stop offset="1" stop-color="#B6C1CE"/>
    </linearGradient>
    <linearGradient id="ice" gradientUnits="userSpaceOnUse" x1="128" y1="54" x2="128" y2="128">
      <stop offset="0" stop-color="#C6EDFF"/>
      <stop offset="1" stop-color="#6FBBF2"/>
    </linearGradient>
    <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="128" y1="128" x2="128" y2="202">
      <stop offset="0" stop-color="#DDE3EB"/>
      <stop offset="1" stop-color="#AEB9C7"/>
    </linearGradient>
    <clipPath id="rightHalf"><rect x="128" y="0" width="128" height="256"/></clipPath>
    <g id="needleShape" stroke-width="6" stroke-linejoin="round">
      <path d="M128 54 L160 128 L96 128 Z" fill="url(#ice)" stroke="url(#ice)"/>
      <path d="M128 202 L96 128 L160 128 Z" fill="url(#silver)" stroke="url(#silver)"/>
    </g>
  </defs><rect width="256" height="256" fill="#191919"/>

  <!-- Ring -->
  <circle cx="128" cy="128" r="100.5" fill="none" stroke="url(#ring)" stroke-width="16"/>

  <!-- Needle (vertical, rotated 45° to point up-right) -->
  <g transform="rotate(45 128 128)">
    <use href="#needleShape"/>
    <!-- subtle facet: shade the right half of the needle -->
    <g clip-path="url(#rightHalf)" opacity="0.13">
      <path d="M128 54 L160 128 L128 202 L96 128 Z" fill="#0B2540" stroke="#0B2540" stroke-width="6" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
